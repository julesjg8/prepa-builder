<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Crée ton plan d'entraînement course à pied (10 km, semi, marathon) avec allures et auto-régulation.">
<meta name="theme-color" content="#d9541c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Prépa Builder">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<style>[hidden]{display:none!important}body{margin:0}</style>
<title>Prépa Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
/* Layout: one column app, sticky header, segmented views. Orange = effort, one color per session type. */
:root{
--bg:#f2f3f1;--surface:#ffffff;--surface-2:#eceeeb;--text:#14171a;--text-2:#474d53;--muted:#70777d;--border:rgba(15,25,35,.11);--grid:rgba(15,25,35,.08);
--accent:#d9541c;--accent-ink:#b4430f;--accent-soft:rgba(217,84,28,.11);--on-accent:#ffffff;
--t-easy:#17905c;--t-quality:#d9541c;--t-long:#2a6fcf;--t-test:#6a55cf;--t-race:#14171a;
--ph-base:#2a6fcf;--ph-build:#6a55cf;--ph-peak:#d9541c;--ph-taper:#17905c;
--good:#17905c;--warn:#c98a00;--bad:#c93a3a;--shadow:0 1px 2px rgba(15,25,35,.05),0 8px 24px rgba(15,25,35,.05);
--f-display:"Space Grotesk",ui-sans-serif,system-ui,sans-serif;--f-body:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
--bg:#0e1012;--surface:#171a1d;--surface-2:#202428;--text:#eef0f1;--text-2:#b8bec3;--muted:#848b91;--border:rgba(255,255,255,.1);--grid:rgba(255,255,255,.07);
--accent:#ef6a30;--accent-ink:#f28a5a;--accent-soft:rgba(239,106,48,.15);--on-accent:#ffffff;
--t-easy:#2fb37b;--t-quality:#ef6a30;--t-long:#3d8ef0;--t-test:#9b8af5;--t-race:#eef0f1;
--ph-base:#3d8ef0;--ph-build:#8a74ea;--ph-peak:#ef6a30;--ph-taper:#2fb37b;
--good:#2fb37b;--warn:#f0b429;--bad:#ec6b6b;--shadow:none;color-scheme:dark}}
:root[data-theme="dark"]{
--bg:#0e1012;--surface:#171a1d;--surface-2:#202428;--text:#eef0f1;--text-2:#b8bec3;--muted:#848b91;--border:rgba(255,255,255,.1);--grid:rgba(255,255,255,.07);
--accent:#ef6a30;--accent-ink:#f28a5a;--accent-soft:rgba(239,106,48,.15);--on-accent:#ffffff;
--t-easy:#2fb37b;--t-quality:#ef6a30;--t-long:#3d8ef0;--t-test:#9b8af5;--t-race:#eef0f1;
--ph-base:#3d8ef0;--ph-build:#8a74ea;--ph-peak:#ef6a30;--ph-taper:#2fb37b;
--good:#2fb37b;--warn:#f0b429;--bad:#ec6b6b;--shadow:none;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--text);font:15px/1.5 var(--f-body);-webkit-tap-highlight-color:transparent}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}button{font:inherit;color:inherit}
.tnum{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:color-mix(in srgb,var(--bg) 88%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
.top-in,.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top-in{height:56px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:700;font-size:17px;flex:1;min-width:0}
.logo{width:30px;height:30px;border-radius:9px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-size:13px}
.wrap{padding-block:18px 64px;display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:18px;box-shadow:var(--shadow);min-width:0}
.eyebrow{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--accent-ink)}
.sub,.note{color:var(--muted);font-size:13px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:8px 16px;border-radius:11px;border:1px solid var(--border);background:var(--surface);font-weight:600;font-size:14px;cursor:pointer}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.sm{min-height:34px;padding:4px 12px;font-size:13px}
.icon-btn{width:40px;height:40px;border-radius:11px;border:1px solid var(--border);background:var(--surface);display:grid;place-items:center;cursor:pointer;font-size:18px}
.icon-btn:disabled{opacity:.3;cursor:default}
/* Setup form */
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 18px;margin-top:18px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field.full{grid-column:1 / -1}
.field label,.field .lbl{font-size:13px;font-weight:600;color:var(--text-2)}
.field small{font-size:12px;color:var(--muted)}

.date-box{position:relative;display:block;width:100%;min-width:0;overflow:hidden;border-radius:11px;border:1px solid var(--border);background:var(--surface-2)}
.date-box .date-ic{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:16px;pointer-events:none}
.field .date-box input[type=date]{-webkit-appearance:none;appearance:none;display:block;width:100%;max-width:100%;min-width:0;border:0;border-radius:0;background:transparent;text-align:left;line-height:26px;padding-right:40px}
.field input[type=date]::-webkit-calendar-picker-indicator{opacity:0;position:absolute;inset:0;width:100%;height:100%;cursor:pointer}
.field input[type=date]::-webkit-date-and-time-value{text-align:left;margin:0}
.field input,.field select{min-height:44px;padding:8px 12px;border-radius:11px;border:1px solid var(--border);background:var(--surface-2);color:var(--text);font:inherit;font-size:16px;min-width:0;width:100%}
.field input:disabled{opacity:.45}
.chk{display:flex;align-items:center;gap:10px;min-height:40px;font-size:14px;color:var(--text-2);cursor:pointer}
.field .chk input{width:20px;height:20px;min-height:0;padding:0;margin:0;border-radius:4px;accent-color:var(--accent);flex:none}
.choice{display:flex;gap:4px;padding:4px;border-radius:12px;background:var(--surface-2);border:1px solid var(--border)}
.choice label{flex:1;position:relative;cursor:pointer}
.choice input{position:absolute;opacity:0;pointer-events:none}
.choice span{display:flex;align-items:center;justify-content:center;min-height:38px;border-radius:9px;font-size:14px;font-weight:600;color:var(--text-2);text-align:center;padding:0 6px}
.choice input:checked + span{background:var(--surface);color:var(--text);box-shadow:0 0 0 1px var(--border),var(--shadow)}
.choice input:focus-visible + span{outline:2px solid var(--accent)}
.form-foot{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:20px}
.err{color:var(--bad);font-size:13px;font-weight:600}
.saved{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.saved-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--surface-2);border:1px solid var(--border)}
.saved-row div{flex:1;min-width:0}.saved-row b{display:block;font-size:14px}.saved-row span{font-size:12px;color:var(--muted)}
/* Hero */
.hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:18px}
.hero h1{font-size:30px;margin-top:6px}
.kv{display:flex;flex-wrap:wrap;gap:22px;margin-top:16px}
.kv div{display:flex;flex-direction:column}
.kv b{font-family:var(--f-display);font-size:30px;line-height:1.1}
.kv span{font-size:12px;color:var(--muted)}
.verdict{background:var(--surface-2);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px;align-self:start}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;align-self:flex-start}
.pill.good{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.pill.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.pill.bad{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.phase-pill{display:inline-flex;gap:6px;align-items:center;margin-top:14px;font-size:13px;padding:5px 12px;border-radius:999px;background:var(--accent-soft);color:var(--text)}
.phase-pill i{width:8px;height:8px;border-radius:50%;background:var(--ph)}
.example{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:10px 14px;border-radius:12px;border:1px dashed var(--accent);background:var(--accent-soft);font-size:13px}
.example b{color:var(--accent-ink)}
/* Segmented */
.seg{display:flex;gap:4px;padding:4px;border-radius:13px;background:var(--surface-2);border:1px solid var(--border);position:sticky;top:calc(env(safe-area-inset-top,0px) + 62px);z-index:5}
.seg button{flex:1;min-height:38px;border:0;border-radius:10px;background:none;font-size:13px;font-weight:600;color:var(--text-2);cursor:pointer}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:0 0 0 1px var(--border),var(--shadow)}
@media (max-width:420px){.seg{gap:2px;padding:3px}.seg button{flex:1 1 auto;padding:0 5px;font-size:12.5px;min-width:0}}
/* Week */
.wk-head{display:flex;align-items:center;gap:10px}
.wk-head > div{flex:1;min-width:0;text-align:center}
.wk-head h2{font-size:18px}
.bar{height:6px;border-radius:4px;background:var(--grid);overflow:hidden;margin-top:12px}.bar i{display:block;height:100%;background:var(--accent);border-radius:4px}
.regul{margin-top:12px;font-size:13px;color:var(--text-2);padding:10px 12px;border-radius:10px;background:var(--surface-2);border-left:3px solid var(--muted)}
.regul.up{border-left-color:var(--good)}.regul.down{border-left-color:var(--warn)}.regul.force{border-left-color:var(--bad)}
.sessions{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(260px,100%),1fr));gap:12px;margin-top:14px}
.session{background:var(--surface-2);border:1px solid var(--border);border-top:3px solid var(--c);border-radius:13px;padding:14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.session.today{box-shadow:0 0 0 2px var(--accent) inset}
.s-day{font-size:12px;color:var(--muted);text-transform:capitalize}
.s-type{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-2)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}
.s-title{font-weight:650;font-size:15px}
.s-desc{font-size:13px;color:var(--text-2)}
.s-toggle{background:none;border:0;padding:0;font-size:12px;font-weight:600;color:var(--accent-ink);cursor:pointer;align-self:flex-start;min-height:28px}
.steps{list-style:none;margin:4px 0 0;padding:10px 0 0;border-top:1px solid var(--grid);display:flex;flex-direction:column;gap:6px}
.steps li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;font-size:13px}
.steps li.rep{grid-template-columns:1fr;background:color-mix(in srgb,var(--c) 9%,transparent);border-radius:8px;padding:8px}
.steps .x{font-weight:700;font-size:12px;color:var(--accent-ink);text-transform:uppercase;letter-spacing:.06em}
.steps .t{color:var(--text-2);font-size:12px;grid-column:1 / -1}
.fb{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;padding-top:10px;border-top:1px solid var(--grid)}
.fb .q{width:100%;font-size:12px;color:var(--muted)}
.fb button{flex:1 1 0;min-width:0;min-height:36px;border-radius:9px;border:1px solid var(--border);background:var(--surface);font-size:12px;font-weight:600;cursor:pointer;padding:0 4px}
.fb button:disabled{opacity:.4;cursor:default}
.fb button.on[data-v="facile"]{background:var(--good);border-color:var(--good);color:#fff}
.fb button.on[data-v="bien"]{background:var(--t-long);border-color:var(--t-long);color:#fff}
.fb button.on[data-v="dur"]{background:var(--warn);border-color:var(--warn);color:#14171a}
.fb button.on[data-v="ratee"]{background:var(--bad);border-color:var(--bad);color:#fff}
/* Calendar */
.cal-head{display:flex;align-items:center;justify-content:space-between;gap:8px}.cal-head h2{text-transform:capitalize;font-size:18px}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px;margin-top:12px}
.cal-wd{text-align:center;font-size:11px;font-weight:700;color:var(--muted);padding-bottom:4px}
.cal-d{min-height:62px;border-radius:8px;background:var(--surface-2);padding:3px;display:flex;flex-direction:column;gap:3px;min-width:0}
.cal-d.out{background:none}.cal-d.out .n{opacity:.3}.cal-d.today{box-shadow:0 0 0 2px var(--accent) inset}.cal-d.race{background:var(--accent-soft)}
.cal-d .n{font-size:11px;font-weight:600;color:var(--text-2);padding-left:2px}
.cal-s{border:0;border-left:3px solid var(--c);border-radius:5px;padding:3px 4px;background:color-mix(in srgb,var(--c) 20%,transparent);font-size:10px;line-height:1.2;text-align:left;cursor:pointer;color:var(--text);min-width:0;overflow:hidden}
.cal-s.done{background:var(--c);color:#fff}
.cal-s em{font-style:normal;display:none}
@media (min-width:720px){.cal-d{min-height:88px;padding:6px}.cal-s{font-size:12px;padding:4px 6px}.cal-s em{display:inline}.cal-d .n{font-size:13px}}
.cal-list{display:flex;flex-direction:column;gap:6px;margin-top:16px}
.cal-sep{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:11px;font-weight:600;color:var(--muted)}.cal-sep::after{content:"";flex:1;height:1px;background:var(--grid)}
.cal-list > .cal-sep:first-child{margin-top:0}
.cal-row{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--border);border-left:4px solid var(--c);background:var(--surface-2);text-align:left;cursor:pointer}
.cal-row .d{flex:none;width:54px;font-size:12px;font-weight:600;color:var(--text-2);text-transform:capitalize}
.cal-row .r{display:flex;flex-direction:column;min-width:0}.cal-row b{font-size:14px;font-weight:600}.cal-row small{font-size:12px;color:var(--text-2)}
/* Programme */
.tl{display:flex;gap:2px;height:30px;margin-top:14px}
.tl div{display:flex;align-items:center;justify-content:center;border-radius:5px;color:#fff;font-size:11px;font-weight:700;overflow:hidden;white-space:nowrap;padding:0 4px;background:var(--ph)}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px;font-size:12px;color:var(--text-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.wk-list{display:flex;flex-direction:column;margin-top:14px}
.wkr{display:grid;grid-template-columns:40px minmax(0,1fr) 120px;gap:10px;align-items:center;padding:10px 8px;border:0;border-top:1px solid var(--grid);border-left:3px solid var(--ph);background:none;text-align:left;cursor:pointer;font-size:13px}
.wkr:hover{background:var(--surface-2)}
.wkr.cur{background:var(--accent-soft)}
.wkr b{font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:5px;min-width:0}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:2px 8px;border-radius:999px;background:var(--surface-2);border:1px solid var(--border);color:var(--text-2)}
.tag{font-size:11px;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--text-2);border:1px solid var(--border)}
.vol{display:flex;align-items:center;gap:8px;justify-content:flex-end;font-weight:600}
.vol .bar{flex:1;margin:0;height:5px}
/* Paces */
.paces{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(200px,100%),1fr));gap:10px;margin-top:14px}
.pace{background:var(--surface-2);border-radius:12px;padding:12px 14px;border-left:3px solid var(--c)}
.pace span{display:block;font-size:12px;color:var(--muted)}.pace b{font-family:var(--f-display);font-size:20px}
.pace small{display:block;font-size:12px;color:var(--text-2);margin-top:2px}
.how{margin-top:18px;font-size:14px;color:var(--text-2);border-top:1px solid var(--grid);padding-top:14px}.how summary{cursor:pointer;font-weight:600;color:var(--text)}.how ul{margin:10px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:8px}.how b{color:var(--text)}
@media (max-width:720px){.hero,.form{grid-template-columns:1fr}.hero h1{font-size:24px}.kv b{font-size:24px}.wkr{grid-template-columns:34px minmax(0,1fr) auto}.vol .bar{display:none}}
button.brand{background:none;border:0;padding:0;color:inherit;cursor:pointer;text-align:left}
.home{padding:28px 22px;background:linear-gradient(140deg,var(--accent-soft),var(--surface) 65%)}
.home h1{font-size:34px;line-height:1.1;margin-top:10px;max-width:16ch}
.home-sub{color:var(--text-2);font-size:16px;margin-top:12px;max-width:52ch}
.home-cta{display:flex;flex-wrap:wrap;gap:10px;margin:22px 0 12px}
.btn.lg{min-height:52px;padding:10px 22px;font-size:16px;border-radius:13px}
.home-feats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.feat{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--text-2)}
.feat b{color:var(--text);font-size:15px;margin-top:6px}
.feat .ic{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-weight:700;font-size:13px;color:#fff;background:var(--c)}
@media (max-width:720px){.home{padding:22px 16px}.home h1{font-size:27px}.home-feats{grid-template-columns:1fr}.home-cta .btn{flex:1 1 100%}}
.date-box:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.install{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:14px;border:1px solid var(--border);background:var(--surface);cursor:pointer;width:100%;text-align:left;color:var(--text);font:inherit}
.install:hover{background:var(--surface-2)}
.install .ii{flex:none;width:38px;height:38px;border-radius:10px;background:var(--accent-soft);display:grid;place-items:center;color:var(--accent-ink)}
.install .ii svg{width:20px;height:20px}
.install b{display:block;font-size:15px}.install span span{font-size:13px;color:var(--muted)}
.install .go{margin-left:auto;color:var(--muted);font-size:20px}
.tuto-bg{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .2s ease}
@keyframes fadeIn{from{opacity:0}}
.tuto{width:100%;max-width:440px;max-height:100dvh;overflow:auto;background:var(--surface);border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
@media (min-width:600px){.tuto-bg{align-items:center}.tuto{border-radius:20px}}
.tuto-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.tuto-top b{font-family:var(--f-display);font-size:17px}
.tuto-x{width:36px;height:36px;border-radius:50%;border:1px solid var(--border);background:var(--surface-2);color:var(--text);font-size:18px;cursor:pointer}
.slides{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;gap:0;-webkit-overflow-scrolling:touch}
.slides::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:center;display:flex;flex-direction:column;align-items:center;gap:12px;padding:4px 2px}
.slide h3{font-size:17px;text-align:center}
.slide p{margin:0;font-size:14px;color:var(--text-2);text-align:center;max-width:34ch}
.step-n{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-ink)}
.ph{width:200px;height:300px;border-radius:30px;background:#111;padding:8px;box-shadow:0 8px 24px rgba(0,0,0,.25);flex:none}

<script>
// Parcours de la course : import d'un .gpx, carte et profil en SVG, téléchargement et partage.
// Tout reste sur ce téléphone (localStorage). Même code dans Prépa Moorea et Prépa Builder.
(function () {
  'use strict';
  var RAD = Math.PI / 180;
  var hav = function (a, b) {
    var dLat = (b[0] - a[0]) * RAD, dLon = (b[1] - a[1]) * RAD;
    var s = Math.pow(Math.sin(dLat / 2), 2) + Math.cos(a[0] * RAD) * Math.cos(b[0] * RAD) * Math.pow(Math.sin(dLon / 2), 2);
    return 2 * 6371000 * Math.asin(Math.sqrt(s));
  };
  var esc = function (x) { return String(x).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
  var r5 = function (x) { return Math.round(x * 1e5) / 1e5; };

  var parse = function (text) {
    var doc = new DOMParser().parseFromString(text, 'application/xml');
    if (doc.getElementsByTagName('parsererror').length) return null;
    var nodes = doc.querySelectorAll('trkpt');
    if (!nodes.length) nodes = doc.querySelectorAll('rtept');
    var pts = [];
    Array.prototype.forEach.call(nodes, function (n) {
      var la = parseFloat(n.getAttribute('lat')), lo = parseFloat(n.getAttribute('lon'));
      if (!isFinite(la) || !isFinite(lo)) return;
      var e = n.getElementsByTagName('ele')[0], ele = e ? parseFloat(e.textContent) : NaN;
      pts.push([r5(la), r5(lo), isFinite(ele) ? Math.round(ele) : null]);
    });
    if (pts.length < 2) return null;
    if (pts.length > 1500) { var step = pts.length / 1500, out = []; for (var i = 0; i < 1500; i++) out.push(pts[Math.floor(i * step)]); out.push(pts[pts.length - 1]); pts = out; }
    var nm = doc.querySelector('trk > name') || doc.querySelector('rte > name') || doc.querySelector('metadata > name');
    return { name: nm ? nm.textContent.trim() : '', pts: pts };
  };

  var stats = function (pts) {
    var dist = [0], up = 0, down = 0, ref = null, hasEle = pts.some(function (p) { return p[2] != null; });
    for (var i = 1; i < pts.length; i++) dist.push(dist[i - 1] + hav(pts[i - 1], pts[i]));
    // Dénivelé avec un seuil de 3 m pour ignorer le bruit du GPS.
    pts.forEach(function (p) { if (p[2] == null) return; if (ref == null) { ref = p[2]; return; } var d = p[2] - ref; if (d >= 3) { up += d; ref = p[2]; } else if (d <= -3) { down -= d; ref = p[2]; } });
    return { dist: dist, km: dist[dist.length - 1] / 1000, up: Math.round(up), down: Math.round(down), hasEle: hasEle };
  };

  var mapSvg = function (pts) {
    var lat0 = pts.reduce(function (s, p) { return s + p[0]; }, 0) / pts.length, k = Math.cos(lat0 * RAD);
    var xy = pts.map(function (p) { return [p[1] * k, -p[0]]; });
    var xs = xy.map(function (p) { return p[0]; }), ys = xy.map(function (p) { return p[1]; });
    var x0 = Math.min.apply(null, xs), x1 = Math.max.apply(null, xs), y0 = Math.min.apply(null, ys), y1 = Math.max.apply(null, ys);
    var W = 320, H = 220, pad = 12, sc = Math.min((W - 2 * pad) / ((x1 - x0) || 1e-9), (H - 2 * pad) / ((y1 - y0) || 1e-9));
    var ox = (W - (x1 - x0) * sc) / 2, oy = (H - (y1 - y0) * sc) / 2;
    var P = xy.map(function (p) { return [(p[0] - x0) * sc + ox, (p[1] - y0) * sc + oy]; });
    var d = P.map(function (p, i) { return (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1); }).join('');
    var a = P[0], b = P[P.length - 1];
    return '<svg class="crs-map" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Tracé du parcours">' +
      '<path d="' + d + '" fill="none" stroke="var(--crs-c)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>' +
      '<circle cx="' + a[0].toFixed(1) + '" cy="' + a[1].toFixed(1) + '" r="5" fill="var(--crs-ok)"/>' +
      '<circle cx="' + b[0].toFixed(1) + '" cy="' + b[1].toFixed(1) + '" r="5" fill="none" stroke="var(--crs-ink)" stroke-width="2.5"/></svg>';
  };

  var profileSvg = function (pts, st) {
    var e = pts.map(function (p) { return p[2]; });
    var known = e.filter(function (v) { return v != null; }); if (!known.length) return '';
    var lo = Math.min.apply(null, known), hi = Math.max.apply(null, known), span = Math.max(20, hi - lo);
    var W = 320, H = 90, top = 8, bot = 18, tot = st.dist[st.dist.length - 1] || 1;
    var x = function (i) { return (st.dist[i] / tot) * W; }, y = function (v) { return top + (1 - (v - lo) / span) * (H - top - bot); };
    var last = known[0], d = '';
    e.forEach(function (v, i) { if (v != null) last = v; d += (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(last).toFixed(1); });
    var ticks = '', stepKm = st.km > 30 ? 10 : st.km > 12 ? 5 : st.km > 4 ? 2 : 1;
    for (var t = stepKm; t < st.km; t += stepKm) { var tx = (t * 1000 / tot) * W; ticks += '<line x1="' + tx.toFixed(1) + '" x2="' + tx.toFixed(1) + '" y1="' + top + '" y2="' + (H - bot) + '" stroke="var(--crs-grid)"/><text x="' + tx.toFixed(1) + '" y="' + (H - 4) + '" text-anchor="middle">' + t + '</text>'; }
    return '<svg class="crs-prof" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Profil : de ' + lo + ' à ' + hi + ' m d\'altitude">' + ticks +
      '<path d="' + d + 'L' + W + ' ' + (H - bot) + 'L0 ' + (H - bot) + 'Z" fill="var(--crs-c)" fill-opacity=".18"/>' +
      '<path d="' + d + '" fill="none" stroke="var(--crs-c)" stroke-width="2"/>' +
      '<text x="2" y="' + (top + 2) + '" dominant-baseline="hanging">' + hi + ' m</text><text x="2" y="' + (H - bot - 3) + '">' + lo + ' m</text></svg>';
  };

  var toGpx = function (c) {
    return '<?xml version="1.0" encoding="UTF-8"?>\n<gpx version="1.1" creator="Prepa" xmlns="http://www.topografix.com/GPX/1/1">\n<trk><name>' + esc(c.name || 'Parcours') + '</name><trkseg>\n' +
      c.pts.map(function (p) { return '<trkpt lat="' + p[0] + '" lon="' + p[1] + '">' + (p[2] != null ? '<ele>' + p[2] + '</ele>' : '') + '</trkpt>'; }).join('\n') + '\n</trkseg></trk>\n</gpx>\n';
  };
  var fileName = function (c) { return (c.name || 'parcours').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^A-Za-z0-9]+/g, '-').replace(/^-|-$/g, '').toLowerCase() + '.gpx'; };
  var download = function (name, txt) {
    var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([txt], { type: 'application/gpx+xml' })); a.download = name;
    document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  };

  var CSS = '.crs{--crs-c:var(--accent,#d95926);--crs-ok:var(--good,#0ca30c);--crs-ink:var(--text,#222);--crs-grid:var(--grid,rgba(127,127,127,.25))}' +
    '.crs-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.crs-kpis{display:flex;flex-wrap:wrap;gap:6px 18px;margin:8px 0;font-size:14px}.crs-kpis b{font-size:17px}' +
    '.crs-map{width:100%;max-width:520px;max-height:260px;display:block;margin-top:6px}.crs-prof{width:100%;max-width:520px;display:block;margin-top:6px;font:10px system-ui,sans-serif;fill:var(--muted,#888)}' +
    '.crs-file{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}.crs-msg{min-height:1em}.crs-msg.err{color:var(--crit-ink,#c33)}';

  // opts: { key, raceKm, raceName }
  var mount = function (el, opts) {
    if (!el) return;
    if (!document.getElementById('crs-css')) { var st = document.createElement('style'); st.id = 'crs-css'; st.textContent = CSS; document.head.appendChild(st); }
    var get = function () { try { return JSON.parse(localStorage.getItem(opts.key) || 'null'); } catch (e) { return null; } };
    var render = function (msg, err) {
      var c = get(), s = c && stats(c.pts);
      var off = s && opts.raceKm && Math.abs(s.km - opts.raceKm) / opts.raceKm > 0.03;
      el.classList.add('crs');
      el.innerHTML = '<h2>Parcours de la course</h2>' + (c
        ? '<div class="sub">' + esc(c.name || opts.raceName || 'Parcours importé') + '</div>' +
          '<div class="crs-kpis tnum"><span><b>' + s.km.toFixed(1).replace('.', ',') + '</b> km</span>' + (s.hasEle ? '<span>D+ <b>' + s.up + '</b> m</span><span>D− <b>' + s.down + '</b> m</span>' : '<span>pas d\'altitude dans le fichier</span>') + '</div>' +
          mapSvg(c.pts) + profileSvg(c.pts, s) +
          (off ? '<p class="note">Le tracé fait ' + s.km.toFixed(1).replace('.', ',') + ' km pour ' + String(opts.raceKm).replace('.', ',') + ' annoncés. Courant sur les courses de campagne : fie-toi plutôt au profil qu\'aux km exacts.</p>' : '') +
          '<p class="note">Point plein = départ, cercle = arrivée. Le profil est en km.</p>' +
          '<div class="crs-row"><button type="button" class="btn" data-crs="dl">Télécharger (.gpx)</button><button type="button" class="btn" data-crs="share">Partager</button><label class="btn">Remplacer<input class="crs-file" type="file" accept=".gpx,application/gpx+xml,application/xml,text/xml"></label><button type="button" class="btn" data-crs="del">Supprimer</button></div>'
        : '<div class="sub">Importe le tracé officiel pour voir la carte, le profil et le dénivelé.</div>' +
          '<p class="note">Où le trouver : le site de la course, ou la trace Strava / Garmin d\'un coureur de l\'an dernier (Exporter en GPX).</p>' +
          '<div class="crs-row"><label class="btn primary">Mettre mon parcours (.gpx)<input class="crs-file" type="file" accept=".gpx,application/gpx+xml,application/xml,text/xml"></label></div>') +
        '<p class="note crs-msg' + (err ? ' err' : '') + '" role="status">' + (msg ? esc(msg) : '') + '</p>';
    };
    el.addEventListener('change', function (e) {
      var f = e.target.files && e.target.files[0]; if (!f) return;
      f.text().then(function (txt) {
        var c = parse(txt);
        if (!c) { render('Fichier illisible : il faut un .gpx avec un tracé.', true); return; }
        try { localStorage.setItem(opts.key, JSON.stringify(c)); } catch (err) { render('Impossible d\'enregistrer (navigation privée ?).', true); return; }
        render('Parcours enregistré sur ce téléphone.');
      });
    });
    el.addEventListener('click', function (e) {
      var b = e.target.closest('[data-crs]'); if (!b) return;
      var c = get(); if (!c) return;
      if (b.dataset.crs === 'del') { if (!confirm('Supprimer le parcours de ce téléphone ?')) return; try { localStorage.removeItem(opts.key); } catch (err) { /* ignore */ } render(); return; }
      var txt = toGpx(c), name = fileName(c);
      if (b.dataset.crs === 'share') {
        var file = typeof File === 'function' ? new File([txt], name, { type: 'application/gpx+xml' }) : null;
        if (file && navigator.canShare && navigator.canShare({ files: [file] })) { navigator.share({ files: [file], title: c.name || 'Parcours' }).catch(function () {}); return; }
      }
      download(name, txt);
    });
    render();
  };
  window.Course = { mount: mount, parse: parse, stats: stats };
})();
</script>
<script>
// Déplacer une séance : recalcule la semaine pour garder au moins 48 h entre deux séances dures
// (qualité, sortie longue, test). Les autres séances glissent en cascade, de préférence plus tard dans la semaine.
// Même code dans Prépa Moorea et Prépa Builder.
(function () {
  'use strict';
  var DAYS = ['lundi', 'mardi', 'mercredi', 'jeudi', 'vendredi', 'samedi', 'dimanche'];
  var GAP = 2; // jours entre deux séances dures

  // Jours candidats autour de "day" : le jour même, puis plus tard, puis plus tôt.
  var around = function (day, minDay) {
    var out = [day];
    for (var k = 1; k < 7; k++) { out.push(day + k); out.push(day - k); }
    return out.filter(function (d) { return d >= minDay && d <= 6; });
  };
  var free = function (placed, d) { return !placed.some(function (p) { return p.day === d; }); };
  var spaced = function (placed, d, hard) { return !hard || !placed.some(function (p) { return p.hard && Math.abs(p.day - d) < GAP; }); };
  var nearHard = function (placed, d, self) { return placed.filter(function (p) { return p.hard && p.id !== self && Math.abs(p.day - d) < GAP; })[0]; };

  // items : [{ id, day (0-6), hard, fixed, label }]. Retourne les nouveaux jours et les problèmes.
  var place = function (items, moverId, to, minDay) {
    var placed = items.filter(function (x) { return x.fixed && x.id !== moverId; }).map(function (x) { return { id: x.id, day: x.day, hard: x.hard, label: x.label }; });
    var mover = items.filter(function (x) { return x.id === moverId; })[0];
    var res = {}, tooClose = [], noRoom = [];
    var mp = { id: mover.id, day: to, hard: mover.hard, label: mover.label };
    var near = mover.hard && nearHard(placed, to, mover.id);
    if (near) tooClose.push({ item: mover, day: to, near: near });
    placed.push(mp); res[mover.id] = to;
    items.filter(function (x) { return !x.fixed && x.id !== moverId; }).sort(function (a, b) { return a.day - b.day; }).forEach(function (x) {
      var c = around(x.day, minDay);
      var d = c.filter(function (k) { return free(placed, k) && spaced(placed, k, x.hard); })[0];
      if (d == null) {
        var d2 = c.filter(function (k) { return free(placed, k); })[0];

function buildPlan(cfg, fb) {

Q('VMA 10 × 400 m', 'Vite et relâché : toutes les répétitions au même chrono.', [rep(10, run('400 m', M(400), P.vma), 75)]),
Q('Seuil 3 × 10 min', 'La séance repère de la base.', [rep(3, thr(T(10)), 150)]),
Q('VMA 5 × 3 min', 'Allure 5 km, récupération courte.', [rep(5, run('3 min', T(3), P.interval), 120)])
],

Q('Fractionné 6 × 1000 m', 'Allure 5 km, toutes les répétitions à la même vitesse.', [rep(6, run('1000 m', M(1000), P.interval), 120)]),
Q('Seuil 2 × 15 min', 'Seuil long pour tenir la vitesse.', [rep(2, thr(T(15)), 180)]),
Q('Fractionné 5 × 1200 m', 'Un cran plus long, même allure.', [rep(5, run('1200 m', M(1200), P.interval), 150)]),

const total = prev.sessions.length;
if (marks.filter((m) => m === 'ratee').length >= 2) { forced = true; why = 'deux séances ratées la semaine dernière'; }

sessions.push({ type: 'race', title: `JOUR J · ${D.label}`, date: raceDate, fixedKm: D.km, fixedSec: cfg.goal, desc: `${cfg.noGoal ? `Objectif : terminer en forme. Repère : environ ${fmtDur(cfg.goal)}, soit ${fmtPace(rp)}/km.` : `Objectif ${fmtDur(cfg.goal)}, soit ${fmtPace(rp)}/km.`} ${cfg.first ? 'C\'est ta première : pars 10 s/km plus lent les 3 premiers km, bois à chaque ravitaillement et garde des forces pour la fin.' : 'Pars 5 s/km plus lent les 2 premiers km.'}`,
steps: [run('Départ prudent', M(2000), around(rp + 5, 3)), run('Allure course', M(Math.round((D.km - 2) * 1000)), raceR)] });
sessions.forEach((s) => { if (s.type === 'quality' && s.date >= raceDate) s.date = addDays(raceDate, -4); });
}
sessions.forEach((s) => { const e = estimate(s.steps); s.km = s.fixedKm || Math.round(e.km * 10) / 10; s.sec = s.fixedSec || e.sec; s.id = key(s.date) + '-' + s.type; });

weeks.push({ index: w, monday: mon, wtr, phase, recovery, forced, level: lvEff, why: lvEff || forced ? why : '', test, longKm, km: Math.round(sessions.reduce((a, s) => a + s.km, 0)), sessions });
}

if (!plans) plans = {};
const makeExample = () => {
const cfg = { name: 'Semi de printemps', dist: 'semi', raceDate: key(sundayIn(13)), goal: parseTime('1:55:00'), ref10k: parseTime('52:30'), refDist: '10k', refTime: parseTime('52:30'), weekKm: 25, runs: 3, longDay: 6, startLong: 10, start: key(addDays(monday(today), -14)) };

<p class="home-sub">Réponds à quelques questions sur ta course et ton niveau : le plan se construit semaine par semaine, avec des allures calculées pour toi, et s'ajuste ensuite à tes ressentis.</p>
<div class="home-cta"><button type="button" class="btn primary lg" data-go="new">Créer mon plan d'entraînement</button>
${saved.length ? `<button type="button" class="btn" data-open="${cur}">Reprendre mon plan</button>` : '<button type="button" class="btn" data-go="example">Voir un exemple</button>'}</div>
<p class="note">Gratuit, sans compte. Ton plan reste enregistré sur cet appareil. On t'a envoyé un plan ? <button type="button" class="linkbtn" data-go="import">Importer un lien</button></p>
</section>
${standalone ? '' : `<button type="button" class="install" data-go="tuto"><span class="ii">${PLUS}</span><span><b>${isIOS ? 'Installe-la sur ton iPhone' : 'Installer sur l\'écran d\'accueil'}</b><span>Tuto en 5 étapes : l'app s'ouvre comme une vraie, et ton plan reste enregistré.</span></span><span class="go">›</span></button>`}
<section class="home-feats">
<div class="feat"><span class="ic" style="--c:var(--t-quality)">1</span><b>Tes allures</b><span>Calculées à partir d'un chrono récent : footing, seuil, fractionné, allure course.</span></div>
<div class="feat"><span class="ic" style="--c:var(--t-long)">2</span><b>Ton calendrier</b><span>De 2 à 6 sorties par semaine, la sortie longue le jour de ton choix, jusqu'au jour J.</span></div>
<div class="feat"><span class="ic" style="--c:var(--t-easy)">3</span><b>Un plan qui s'adapte</b><span>Note chaque séance (facile, dur, ratée…) : la semaine suivante s'allège ou se durcit.</span></div>
</section>`;
}
function render() { if (view === 'home' || !plans[cur] && view === 'plan') renderHome(); else if (view === 'plan') renderPlan(); else renderSetup(view === 'edit'); }

app.addEventListener('click', (e) => {
const t = e.target.closest('button');
if (!t) return;
const d = t.dataset;
if (d.sub) { sub = d.sub; if (d.watch) watchOpen = true; render(); return; }
if (d.mv || d.mvreset || d.mvnext || d.mvdel || d.mvundo || d.mvact) { const P = plans[cur]; P.moves = P.moves || {};
if (d.mvundo) { delete P.moves[d.mvundo]; save(); render(); return; }
if (d.mvact) { const p = pendingMove; if (!p) return; const box = t.closest('.mv-out');
if (d.mvact === 'cancel') { box.hidden = true; pendingMove = null; return; }
const pb = p.r.noRoom[0] || p.r.tooClose[0];
if (d.mvact === 'ok' || d.mvact === 'keep') p.commit();
else if (d.mvact === 'remove') { p.commit(pb.item); P.moves[pb.item.id] = 'x'; }
else if (d.mvact === 'next') { p.commit(pb.item); if (!pushNext(P, pb.item.s)) { alert('Pas de place la semaine prochaine.'); return; } }
pendingMove = null; save(); render(); return; }
const s = PL && PL.weeks.flatMap((w) => w.sessions).find((x) => x.id === (d.mv || d.mvreset || d.mvnext || d.mvdel)); if (!s) return;
if (d.mvreset) { delete P.moves[s.id]; save(); render(); return; }
if (d.mvdel) { if (!confirm(`Supprimer « ${s.title} » de ton plan ? Tu pourras la rétablir.`)) return; P.moves[s.id] = 'x'; save(); render(); return; }
if (d.mvnext) { if (!pushNext(P, s)) { alert('Pas de place la semaine prochaine.'); return; } save(); render(); return; }
proposeMove(P, s, Number(d.to), t.closest('.move').querySelector('.mv-out')); return; }
if (d.ics) { downloadIcs(); return; }
if (d.nutri) { const P = plans[cur]; P.cfg.nutri = !P.cfg.nutri; save(); render(); return; }
if (d.share) { const c = { ...plans[cur].cfg }, url = shareUrl(c), title = `Plan ${DIST[c.dist].label}${c.name ? ' · ' + c.name : ''}`;
if (navigator.share) navigator.share({ title, text: 'Mon plan d\'entraînement Prépa Builder', url }).catch(() => {});
else if (navigator.clipboard) navigator.clipboard.writeText(url).then(() => { t.textContent = 'Lien copié ✓'; }, () => prompt('Copie ce lien :', url));
else prompt('Copie ce lien :', url); return; }
if (d.recadd) { const k = document.getElementById('recK').value, tt = parseTime(document.getElementById('recT').value), dd = document.getElementById('recD').value, m = app.querySelector('.rec-msg');
if (!isFinite(tt) || tt < 600 || !/^\d{4}-\d{2}-\d{2}$/.test(dd)) { m.textContent = 'Format attendu : 45:30 ou 1:52:10.'; m.classList.add('err'); return; }
const r = store.get('pb.records', {}); r[k] = { t: tt, d: dd }; store.set('pb.records', r); render(); const det = app.querySelector('.records'); if (det) det.open = true; return; }
if (d.recdel) { const r = store.get('pb.records', {}); delete r[d.recdel]; store.set('pb.records', r); render(); const det = app.querySelector('.records'); if (det) det.open = true; return; }
if (d.go === 'import') { const l = prompt('Colle le lien du plan partagé :'); if (l) importShared(readShared(l)); return; }
if (d.wk != null) { weekIdx = Number(d.wk); render(); return; }
if (d.mo != null) { monthIdx = Number(d.mo); render(); return; }
if (d.wkgo != null) { weekIdx = Number(d.wkgo); sub = 'week'; render(); window.scrollTo(0, 0); return; }
if (d.steps) { openSteps.has(d.steps) ? openSteps.delete(d.steps) : openSteps.add(d.steps); render(); return; }
if (d.fb) { const P = plans[cur]; P.fb[d.fb] === d.v ? delete P.fb[d.fb] : (P.fb[d.fb] = d.v); save(); render(); return; }
if (d.goto) { const plan = app._plan, w = plan.weeks.find((x) => x.sessions.some((s) => s.id === d.goto)); weekIdx = w.index; sub = 'week'; openSteps.add(d.goto); render(); window.scrollTo(0, 0); return; }
if (d.go === 'new') { view = 'new'; render(); window.scrollTo(0, 0); return; }
if (d.go === 'edit') { view = 'edit'; render(); window.scrollTo(0, 0); return; }
if (d.go === 'plan') { view = 'plan'; render(); return; }
if (d.go === 'tuto') { openTuto(); return; }
if (d.go === 'home') { view = 'home'; render(); window.scrollTo(0, 0); return; }
if (d.go === 'example') { makeExample(); save(); view = 'plan'; sub = 'week'; weekIdx = monthIdx = null; render(); window.scrollTo(0, 0); return; }
if (d.open) { cur = d.open; save(); view = 'plan'; sub = 'week'; weekIdx = monthIdx = null; render(); window.scrollTo(0, 0); return; }
if (d.del) { if (t.dataset.confirm) { delete plans[d.del]; if (cur === d.del) cur = Object.keys(plans)[0] || null; save(); if (!cur) view = 'home'; render(); } else { t.dataset.confirm = '1'; t.textContent = 'Confirmer ?'; } }
});
document.getElementById('homeBtn').addEventListener('click', () => { view = 'home'; render(); window.scrollTo(0, 0); });
document.getElementById('newBtn').addEventListener('click', () => { view = 'new'; render(); window.scrollTo(0, 0); });
render();
if (/^#p=/.test(location.hash)) { const c = readShared(location.hash); history.replaceState(null, '', location.pathname + location.search); setTimeout(() => importShared(c), 300); }
})();
</script>
</html>
